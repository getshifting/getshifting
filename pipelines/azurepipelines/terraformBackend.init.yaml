parameters:
  subscription: ""

steps:
- task: AzureCLI@2
  displayName: Fetch credentials for Azure
  inputs:
    azureSubscription: '$(AzureServiceConnection)'
    scriptType: bash
    addSpnToEnvironment: true
    useGlobalConfig: true
    scriptLocation: inlineScript
    inlineScript: |
      echo "##vso[task.setvariable variable=ARM_TENANT_ID;]$tenantId"
      echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$servicePrincipalId"
      echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
- task: AzureCLI@2
  displayName: 'Terraform Init'
  inputs:
    azureSubscription: '$(AzureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      terraform version
      terraform init \
        -backend-config=storage_account_name=$(backendSA) \
        -backend-config=container_name=$(backendSAC) \
        -backend-config=key=$(backendStatefile) \
        -backend-config=resource_group_name=$(backendRG) \
        -backend-config=subscription_id=${{ parameters.subscription }} \
        -backend-config=tenant_id=$(ARM_TENANT_ID) \
        -backend-config=client_id=$(ARM_CLIENT_ID) \
        -backend-config=client_secret=$(ARM_CLIENT_SECRET)
    workingDirectory: $(workingDirectory)
