    targetPort: rpc
  selector:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/instance: influxdb
---
# Source: influxdb/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  labels:
    helm.sh/chart: influxdb-4.12.0
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/instance: influxdb
    app.kubernetes.io/version: "1.8.10"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: influxdb
      app.kubernetes.io/instance: influxdb
  serviceName: "influxdb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb
        app.kubernetes.io/instance: influxdb
        azure.workload.identity/use: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/mode
                operator: NotIn
                values:
                - system
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: mobile
      serviceAccountName: influxdb
      containers:
      - name: influxdb
        image: "acrshift.azurecr.io/docker/influxdb/influxdb:1.8.10-alpine"
        imagePullPolicy: "IfNotPresent"
        resources:
          limits:
            memory: 16Gi
          requests:
            cpu: 800m
            memory: 15Gi
        ports:
        - name: api
          containerPort: 8086
        - name: rpc
          containerPort: 8088
        env:
          - name: GOMEMLIMIT
            value: 16GiB
        livenessProbe:
          httpGet:
            path: /ping
            port: api
            scheme: HTTP
          initialDelaySeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ping
            port: api
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 1
        volumeMounts:
        - name: influxdb-data
          mountPath: /var/lib/influxdb
        - name: config
          mountPath: /etc/influxdb
        - mountPath: /mnt/secrets-store
          name: secrets-store-inline
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: influxdb
      # Cannot use existing claim in enterprise mode
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: azure-secretprovider-influxdb
        name: secrets-store-inline
  # Must use volume claim template in enterprise mode
  volumeClaimTemplates:
    - metadata:
        name: influxdb-data
        annotations:
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "64Gi"
---
# Source: influxdb/templates/backup-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: influxdb-backup
  labels:
    helm.sh/chart: influxdb-4.12.0
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/instance: influxdb
    app.kubernetes.io/version: "1.8.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backup
  annotations:
    {}
spec:
  schedule: "0 0 * * *"
  startingDeadlineSeconds: 
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: influxdb
            app.kubernetes.io/instance: influxdb
        spec:
          restartPolicy: OnFailure
          volumes:
          - name: backup
            emptyDir: {}
          serviceAccountName: influxdb
          initContainers:
          - name: influxdb-backup
            image: "acrshift.azurecr.io/docker/influxdb/influxdb:1.8.10-alpine"
            volumeMounts:
            - name: backup
              mountPath: /backup
            command:
            - /bin/sh
            args:
            - '-c'
            - |
              influxd backup \
                -host influxdb.shiftapp.svc:8088 \
                -portable /backup/"$(date +%Y%m%d%H%M%S)"
            resources:
              requests:
                ephemeral-storage: 8Gi
          containers:
          - name: azure-cli
            image: mcr.microsoft.com/azure-cli
            command:
            - /bin/sh
            args:
            - '-c'
            - '-e'
            - |
              az storage container create --name "$DST_CONTAINER"
              az storage blob upload-batch --destination "$DST_CONTAINER" --destination-path "$DST_PATH" --source "$SRC_URL"
              rm -rf /backup/*
            volumeMounts:
            - name: backup
              mountPath: /backup
            env:
              - name: SRC_URL
                value: /backup
              - name: DST_CONTAINER
                value: influxdb-backups
              - name: DST_PATH
                value: 
              - name: AZURE_STORAGE_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: influxdb-azurestorage
                    key: connection-string
            resources:
              requests:
                ephemeral-storage: 8Gi

