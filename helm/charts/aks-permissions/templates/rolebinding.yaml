{{- range .Values.clusterRoleBindings }}
{{- if .description }}
# {{ .description }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .name }}
subjects:
- kind: Group
  name: {{ .groupName }}
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: {{ .clusterRole }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}

{{- range .Values.roleBindings }}
{{- $roleBinding := . }}
{{- range .namespaces }}
{{- if $roleBinding.description }}
# {{ $roleBinding.description }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleBinding.name }}
  namespace: {{ . }}
subjects:
- kind: Group
  name: {{ $roleBinding.groupName }}
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: {{ $roleBinding.clusterRole }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- end }}
